  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:700 32px Arial,sans-serif;fill:#fff;letter-spacing:1px}.subtitle{font:600 16px Arial,sans-serif;fill:#ff9d2e;letter-spacing:3px}.layer{font:700 16px Arial,sans-serif;fill:#fff}.copy{font:400 13px Arial,sans-serif;fill:#ddd1ed}.service{font:600 12px Arial,sans-serif;fill:#fff}.num{font:700 17px Arial,sans-serif;fill:#160822}.arrow{stroke:#ffb04a;stroke-width:4;fill:none;marker-end:url(#arrowhead)}
  </style>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ffb04a"/></marker>
</defs>
